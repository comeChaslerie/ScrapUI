<scrap-header appName="Scrap UI" homeHref="/fondations">
  <span logo class="logo">SU</span>
  <scrap-theme-toggle actions />
</scrap-header>

<div class="shell">
  <nav class="stories" aria-label="Composants">
    <p class="stories-title">Vitrine</p>
    <ul>
      @for (story of stories; track story.path) {
        <li>
          <a [routerLink]="story.path" routerLinkActive="on">{{ story.title }}</a>
        </li>
      }
    </ul>
  </nav>

  <main id="contenu">
    <router-outlet />
  </main>
</div>

<scrap-footer appName="Scrap UI">
  <div>
    <h3>Direction artistique</h3>
    <p>Palette et typos figées.<br />Seul le logo change d'un projet à l'autre.</p>
  </div>
</scrap-footer>

<scrap-toasts />
